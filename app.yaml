alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: we-need-a-ballroom
    match:
      authority:
        exact: ""
      path:
        prefix: /
name: plankton-app
region: nyc
static_sites:
- build_command: npm run build
  environment_slug: node-js
  github:
    branch: main
    deploy_on_push: true
    repo: ultamatt/we_need_a_ballroom
  name: we-need-a-ballroom
  output_dir: dist
  source_dir: /
